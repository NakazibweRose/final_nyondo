<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nyondo Hardware</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    :root {
      --black: #111111;
      --bronze: #cd7f32;
      --white: #ffffff;
      --light-bg: #f8f9fa;
    }

    body {
      background-color: var(--light-bg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .navbar-custom {
      background-color: var(--black);
    }

    .navbar-brand {
      color: var(--bronze) !important;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .navbar-custom .nav-link {
      color: var(--white);
    }

    .navbar-custom .nav-link i {
      color: var(--bronze);
      margin-right: 5px;
    }

    .navbar-custom .nav-link:hover {
      background-color: var(--bronze);
      color: var(--black);
    }

    .navbar-custom .nav-link:hover i {
      color: var(--black);
    }

    .main-content {
      flex: 1;
      padding: 30px 0;
    }

    .footer-custom {
      background-color: var(--black);
      color: var(--white);
    }

    .footer-custom a {
      color: var(--bronze);
      text-decoration: none;
    }

    .footer-custom a:hover {
      color: var(--white);
    }
  </style>
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark navbar-custom shadow">
  <div class="container-fluid px-4">
    <a class="navbar-brand" href="#">
      <i class="bi bi-shop"></i> Nyondo General Hardware
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="mainNavbar">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="#"><i class="bi bi-speedometer2"></i> Dashboard</a></li>
        <li class="nav-item"><a class="nav-link" href="#"><i class="bi bi-box-seam"></i> Stock</a></li>
        <li class="nav-item"><a class="nav-link" href="#"><i class="bi bi-cart"></i> Sales</a></li>
        <li class="nav-item"><a class="nav-link" href="#"><i class="bi bi-truck"></i> Transport</a></li>
        <li class="nav-item"><a class="nav-link" href="#"><i class="bi bi-diagram-3"></i> Schemes</a></li>
        <li class="nav-item"><a class="nav-link" href="#"><i class="bi bi-gear"></i> Settings</a></li>
        <li class="nav-item"><a class="nav-link" href="#"><i class="bi bi-person"></i> Profile</a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="main-content container text-center">
  <h1 class="mb-4">Welcome to Nyondo General Hardware</h1>
  <p><i>From Our Store To Your Site</i></p>
</div>
{% block content %}
{% endblock %}

<footer class="footer-custom py-4 mt-auto">
  <div class="container text-center">
    <div class="mb-3">
      <a href="#" class="mx-2"><i class="bi bi-facebook fs-4"></i></a>
      <a href="#" class="mx-2"><i class="bi bi-twitter fs-4"></i></a>
      <a href="#" class="mx-2"><i class="bi bi-instagram fs-4"></i></a>
      <a href="#" class="mx-2"><i class="bi bi-linkedin fs-4"></i></a>
    </div>
    <p class="mb-0">&copy; 2026 <span style="color: var(--bronze); font-weight:600;">Nyondo General Hardware</span>. All rights reserved.</p>

  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
