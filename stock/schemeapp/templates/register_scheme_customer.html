{% extends 'base.html' %}

{% block content %}

<div class="card shadow-sm">

    <div class="card-header bg-success text-white">
        <h3 class="mb-0">Register Scheme Customer</h3>
    </div>

    <div class="card-body">

        <form method="POST">

            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label">Full Name</label>

                <input type="text"
                       name="full_name"
                       class="form-control"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label">NIN Number</label>

                <input type="text"
                       name="nin_number"
                       class="form-control"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label">Phone Number</label>

                <input type="text"
                       name="phone_number"
                       class="form-control"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label">Address</label>

                <textarea name="address"
                          rows="3"
                          class="form-control"
                          required></textarea>
            </div>

            <div class="mb-3">
                <label class="form-label">Occupation</label>

                <input type="text"
                       name="occupation"
                       class="form-control">
            </div>

            <div class="mb-3">
                <label class="form-label">Employer Name</label>

                <input type="text"
                       name="employer_name"
                       class="form-control">
            </div>

            <button type="submit"
                    class="btn btn-success">
                Register Customer
            </button>

            <a href="{% url 'scheme_customer_list' %}"
               class="btn btn-secondary">
                Cancel
            </a>

        </form>

    </div>
</div>

{% endblock %}
